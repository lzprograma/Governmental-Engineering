[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrg-sovereign-agi"
version = "0.3.0"
description = "Infraestrutura nacional de cidadãos-modelo e arquitetura ACIA soberana de Lunz."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary research prototype"}
authors = [{name = "Governo de Lunz"}]
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "cryptography>=42.0", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
lrg-acia = "lrg_acia.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lrg_acia*"]

[tool.setuptools.package-data]
lrg_acia = ["web/*.html"]
